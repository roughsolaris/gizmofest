<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>GizmoFest Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<section id="login" class="login" hidden>
  <form id="loginForm" class="login-box" autocomplete="off">
    <div class="brand"><b>Gizmo<i>Fest</i></b><small>Owner admin</small></div>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <p class="err" id="loginErr"></p>
    <button class="btn" id="loginBtn" type="submit">Log in</button>
  </form>
</section>
<div id="app" class="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><b>Gizmo<i>Fest</i></b><small>Admin</small></div>
    <nav id="nav"></nav>
    <button class="btn ghost" id="logout">Log out</button>
  </aside>
  <main class="main"><header class="bar"><button class="btn ghost sm menu" id="menuBtn" aria-label="Menu">☰</button><h1 id="title"></h1><span class="grow"></span><a class="btn ghost sm" href="../index.html" target="_blank" rel="noopener">View store</a></header><div id="view"></div></main>
</div>
<div class="modal" id="modal" hidden><div class="modal-box" id="modalBox"></div></div>
<div class="toasts" id="toasts"></div>
<script src="admin.js"></script>
</body>
</html>
